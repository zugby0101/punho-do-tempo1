# Publicação do servidor intermediário no Render (https://render.com) — plano gratuito.
# No Render: New + > Blueprint > escolha este repositório.
services:
  - type: web
    name: punho-do-tempo-relay
    runtime: node
    rootDir: relay-server
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    plan: free
    healthCheckPath: /
